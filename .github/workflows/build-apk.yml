name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: rewind-player-mobile

jobs:
  build:
    name: Build Expo APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the eas.json build pin; RN 0.88 tools require >= 22.13 / 24.3.
          node-version: 24
          cache: npm
          cache-dependency-path: rewind-player-mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android step: ubuntu-latest ships a preinstalled SDK with
      # licenses accepted, and AGP auto-downloads missing platforms
      # (android-37 here) during the Gradle build.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Write .env from GitHub secrets
        run: |
          cat > .env <<'EOF'
          EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_KEYCLOAK_URL=${{ secrets.EXPO_PUBLIC_KEYCLOAK_URL }}
          EXPO_PUBLIC_KEYCLOAK_REALM=${{ secrets.EXPO_PUBLIC_KEYCLOAK_REALM }}
          EXPO_PUBLIC_KEYCLOAK_CLIENT_ID=${{ secrets.EXPO_PUBLIC_KEYCLOAK_CLIENT_ID }}
          EXPO_PUBLIC_MARKETPLACE_URL=${{ secrets.EXPO_PUBLIC_MARKETPLACE_URL }}
          EOF

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK (dev)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a

      - name: Build release APK (beta)
        run: |
          cd android
          chmod +x gradlew
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/rewind.keystore"
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/rewind.keystore" \
              -Pandroid.injected.signing.store.password="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.RELEASE_KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.RELEASE_KEY_PASSWORD }}"
          else
            # Fallback: the runner's debug keystore. Works, but the signature
            # is not guaranteed stable across runner-image updates — add the
            # real keystore secrets before wide beta distribution.
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a \
              -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android
          fi

      - name: Publish APKs to releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp android/app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/dist/rewind-debug.apk"
          cp android/app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/dist/rewind-beta.apk"

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/dist/rewind-debug.apk" \
            --title "Latest dev build" \
            --prerelease \
            --notes "Debug build from $(git rev-parse --short HEAD). Meant for development — expects the Expo dev server." \
            --target main

          gh release delete beta --yes --cleanup-tag || true
          gh release create beta "$RUNNER_TEMP/dist/rewind-beta.apk" \
            --title "Beta" \
            --prerelease \
            --notes "Release build from $(git rev-parse --short HEAD). Installs and runs standalone — no dev server needed." \
            --target main
