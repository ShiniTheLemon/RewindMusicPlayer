name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: rewind-player-mobile

jobs:
  build:
    name: Build Expo APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the eas.json build pin; RN 0.88 tools require >= 22.13 / 24.3.
          node-version: 24
          cache: npm
          cache-dependency-path: rewind-player-mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android step: ubuntu-latest ships a preinstalled SDK with
      # licenses accepted, and AGP auto-downloads missing platforms
      # (android-37 here) during the Gradle build.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Write .env from GitHub secrets
        run: |
          cat > .env <<'EOF'
          EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_KEYCLOAK_URL=${{ secrets.EXPO_PUBLIC_KEYCLOAK_URL }}
          EXPO_PUBLIC_KEYCLOAK_REALM=${{ secrets.EXPO_PUBLIC_KEYCLOAK_REALM }}
          EXPO_PUBLIC_KEYCLOAK_CLIENT_ID=${{ secrets.EXPO_PUBLIC_KEYCLOAK_CLIENT_ID }}
          EXPO_PUBLIC_MARKETPLACE_URL=${{ secrets.EXPO_PUBLIC_MARKETPLACE_URL }}
          EOF

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a

      - name: Publish APK to releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            android/app/build/outputs/apk/debug/*.apk \
            --title "Latest build" \
            --prerelease \
            --notes "Automated build from $(git rev-parse --short HEAD)" \
            --target main
